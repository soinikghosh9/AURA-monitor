[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsf"
version = "0.1.0"
description = "Patient-adaptive EEG monitoring for epilepsy: code for a retrospective multi-cohort design study."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Paper 2 authors" }]

# Base runtime deps required for the Phase 0/1 synthetic-validation pipeline.
# Heavier, phase-specific deps live under [project.optional-dependencies] so the
# core install stays light and reproducible across platforms.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]                       # CNN-LSTM deep early-warning detector (Phase 1b/3)
ews = ["ewstools>=2.1"]                     # classic CSD baselines (Phase 1c)
track = ["filterpy>=1.4.5", "particles>=0.3"]  # causal slow tracker (Phase 4)
forecast = ["lifelines>=0.27"]             # Cox / point-process hazard forecaster (Phase 5)
ieeg = ["mne>=1.6", "h5py>=3.10", "pyarrow>=14"]  # real iEEG loaders (Phase 2+)
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
all = [
    "torch>=2.2", "ewstools>=2.1", "filterpy>=1.4.5", "particles>=0.3",
    "lifelines>=0.27", "mne>=1.6", "h5py>=3.10", "pyarrow>=14",
]

[project.scripts]
bsf = "bsf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (full training / large simulations); deselect with -m 'not slow'",
    "deep: requires the optional 'deep' (torch) extra",
    "integration: end-to-end pipeline tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E741"]  # ambiguous variable names (x0, l) are standard in dynamical-systems code

[tool.ruff.lint.per-file-ignores]
# matplotlib backend must be set before importing pyplot, so imports follow `matplotlib.use(...)`.
"src/bsf/viz/figures.py" = ["E402"]
# torch-dependent imports intentionally follow `pytest.importorskip("torch")`.
"tests/test_deep_ews.py" = ["E402"]
"tests/test_zero_shot.py" = ["E402"]
"tests/test_transfer.py" = ["E402"]
